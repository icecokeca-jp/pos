<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ramen Butcher - POS System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            height: 100vh;
        }
        
        .menu-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
        }
        
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .menu-title {
            font-size: 20px;
            font-weight: 700;
            color: #222;
        }
        
        .header-buttons {
            display: flex;
            gap: 8px;
        }
        
        .export-btn, .status-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .export-btn {
            background: #4CAF50;
            color: white;
        }
        
        .export-btn:hover {
            background: #45a049;
        }
        
        .status-btn {
            background: #2196F3;
            color: white;
            cursor: default;
        }
        
        .status-btn.synced {
            background: #4CAF50;
        }
        
        .status-btn.error {
            background: #f44336;
        }
        
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
        }
        
        .category-tab {
            padding: 8px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        .category-tab.active {
            color: #d84030;
            border-bottom-color: #d84030;
        }
        
        .category-tab:hover {
            color: #333;
        }
        
        .menu-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        
        .menu-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .menu-item:hover {
            border-color: #d84030;
            box-shadow: 0 2px 8px rgba(216, 64, 48, 0.15);
        }
        
        .menu-item-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .menu-item-price {
            font-size: 16px;
            font-weight: 700;
            color: #d84030;
        }
        
        .cart-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .cart-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #222;
        }
        
        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 16px;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .cart-item-left {
            flex: 1;
        }
        
        .cart-item-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .cart-item-qty {
            font-size: 12px;
            color: #999;
        }
        
        .cart-item-actions {
            display: flex;
            gap: 4px;
        }
        
        .qty-btn {
            width: 24px;
            height: 24px;
            padding: 0;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            color: #666;
            transition: all 0.2s;
        }
        
        .qty-btn:hover {
            border-color: #d84030;
            color: #d84030;
        }
        
        .cart-item-price {
            font-weight: 600;
            width: 50px;
            text-align: right;
        }
        
        .delete-btn {
            width: 20px;
            height: 20px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #999;
            font-size: 12px;
            transition: color 0.2s;
            margin-left: 8px;
        }
        
        .delete-btn:hover {
            color: #d84030;
        }
        
        .cart-summary {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            margin-bottom: 12px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        
        .summary-row.total {
            font-size: 16px;
            font-weight: 700;
            color: #222;
            margin-top: 8px;
        }
        
        .summary-row.total .value {
            color: #d84030;
        }
        
        .checkout-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #d84030;
            color: white;
        }
        
        .btn-primary:hover {
            background: #c03828;
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 13px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .modal h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #222;
        }
        
        .modal-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .modal label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .modal label:hover {
            border-color: #d84030;
        }
        
        .modal input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .modal-buttons .cancel-btn {
            border: 1px solid #ddd;
            background: white;
            color: #333;
        }
        
        .modal-buttons .confirm-btn {
            background: #d84030;
            color: white;
        }
        
        .card-section {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
        }
        
        .card-section.active {
            display: block;
        }
        
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .menu-section {
                min-height: 400px;
            }
            
            .cart-section {
                height: auto;
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu-section">
            <div class="menu-header">
                <div class="menu-title">🍜 The Ramen Butcher</div>
                <div class="header-buttons">
                    <button class="status-btn" id="statusBtn">📡 同期中...</button>
                    <button class="export-btn" onclick="exportToCSV()">📊 CSV</button>
                </div>
            </div>
            
            <div class="category-tabs">
                <button class="category-tab active" data-category="all">ALL</button>
                <button class="category-tab" data-category="Ramen">Ramen</button>
                <button class="category-tab" data-category="Tsukemen">Tsukemen</button>
                <button class="category-tab" data-category="Donburi">Don</button>
                <button class="category-tab" data-category="Gyoza">Gyoza</button>
                <button class="category-tab" data-category="Side">Side</button>
                <button class="category-tab" data-category="Drink">Drink</button>
                <button class="category-tab" data-category="Topping">Topping</button>
            </div>
            
            <div class="menu-items" id="menuItems"></div>
        </div>
        
        <div class="cart-section">
            <div class="cart-title">カート</div>
            
            <div class="cart-items" id="cartItems">
                <div class="empty-message">アイテムを追加してください</div>
            </div>
            
            <div class="cart-summary">
                <div class="summary-row">
                    <span>小計:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>税金 (5%):</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>合計:</span>
                    <span class="value" id="total">$0.00</span>
                </div>
            </div>
            
            <div class="checkout-section">
                <button class="btn btn-primary" id="paymentBtn" disabled>決済する</button>
                <button class="btn btn-secondary" id="clearBtn">クリア</button>
            </div>
        </div>
    </div>

    <!-- 決済方法モーダル -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h2>決済方法を選択</h2>
            
            <div class="modal-group">
                <label>
                    <input type="radio" name="paymentMethod" value="cash" checked onchange="toggleCardSection()">
                    <span>💵 現金</span>
                </label>
                
                <label>
                    <input type="radio" name="paymentMethod" value="credit" onchange="toggleCardSection()">
                    <span>💳 クレジットカード</span>
                </label>
            </div>

            <div id="cardTypeSection" class="card-section">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #333;">カード種類:</label>
                <select id="cardType" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
                    <option value="">選択してください</option>
                    <option value="Visa">Visa</option>
                    <option value="Mastercard">Mastercard</option>
                    <option value="Amex">American Express</option>
                    <option value="Diners">Diners Club</option>
                    <option value="JCB">JCB</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closePaymentModal()">キャンセル</button>
                <button class="confirm-btn" onclick="confirmPayment()">決済完了</button>
            </div>
        </div>
    </div>

    <script>
        const menuData = [
            { category: 'Ramen', name: 'Classic Ramen', price: 13.50 },
            { category: 'Ramen', name: 'Red Spicy Ramen', price: 17.50 },
            { category: 'Ramen', name: 'Black Garlic Ramen', price: 17.50 },
            { category: 'Ramen', name: 'Green Basil Ramen', price: 17.50 },
            { category: 'Ramen', name: 'Shoyu Ramen', price: 17.50 },
            { category: 'Ramen', name: 'Coconut Curry Ramen', price: 17.95 },
            { category: 'Ramen', name: 'Iekei Ramen', price: 17.95 },
            { category: 'Ramen', name: 'Vege Tantan Ramen', price: 17.50 },
            { category: 'Ramen', name: 'Vegetarian Ramen', price: 17.50 },
            { category: 'Ramen', name: 'Miso Ramen', price: 17.50 },
            { category: 'Tsukemen', name: 'Tsukemen - Karaage', price: 18.75 },
            { category: 'Tsukemen', name: 'Tsukemen - Chashu', price: 18.75 },
            { category: 'Tsukemen', name: 'Spicy Tsukemen - Karaage', price: 19.75 },
            { category: 'Tsukemen', name: 'Spicy Tsukemen - Chashu', price: 19.75 },
            { category: 'Tsukemen', name: 'Shoyu Tsukemen Karaage', price: 19.00 },
            { category: 'Tsukemen', name: 'Shoyu Tsukemen Chashu', price: 19.00 },
            { category: 'Donburi', name: 'Regular Karaage Don', price: 17.90 },
            { category: 'Donburi', name: 'Mini Karaage Don', price: 9.50 },
            { category: 'Donburi', name: 'Mini Chashu Don', price: 7.95 },
            { category: 'Donburi', name: 'Mini Spicy Teri Don', price: 7.95 },
            { category: 'Donburi', name: 'Gyudon', price: 9.95 },
            { category: 'Donburi', name: 'Mini Curry Rice', price: 7.95 },
            { category: 'Donburi', name: 'Mini Karaage Curry Rice', price: 8.95 },
            { category: 'Donburi', name: 'Regular Karaage Curry Rice', price: 17.50 },
            { category: 'Gyoza', name: 'Gyoza', price: 8.90 },
            { category: 'Gyoza', name: 'Spicy Gyoza', price: 9.50 },
            { category: 'Gyoza', name: 'Okonomi Gyoza', price: 9.50 },
            { category: 'Gyoza', name: 'Truffle Gyoza', price: 9.50 },
            { category: 'Gyoza', name: 'Matcha Vege Gyoza', price: 9.95 },
            { category: 'Side', name: 'Karaage', price: 9.80 },
            { category: 'Side', name: 'Tartar Karaage', price: 9.95 },
            { category: 'Side', name: 'Teriyaki Spicy Karaage', price: 9.95 },
            { category: 'Side', name: 'Garlic Cucumber', price: 6.00 },
            { category: 'Side', name: 'Edamame', price: 6.00 },
            { category: 'Side', name: 'Steamed Rice', price: 2.50 },
            { category: 'Side', name: 'Kids Meal', price: 9.95 },
            { category: 'Side', name: 'Garden Salad', price: 6.00 },
            { category: 'Drink', name: 'Coke', price: 3.00 },
            { category: 'Drink', name: 'Diet Coke', price: 3.00 },
            { category: 'Drink', name: 'Ginger Ale', price: 3.00 },
            { category: 'Topping', name: 'Extra Karaage', price: 3.00 },
            { category: 'Topping', name: 'Extra Corn', price: 1.50 },
            { category: 'Topping', name: 'Extra Ajitama', price: 1.95 },
            { category: 'Topping', name: 'Extra Spicy Garlic Paste', price: 1.95 },
            { category: 'Topping', name: 'Extra Bean Sprouts', price: 1.95 },
            { category: 'Topping', name: 'Extra Green Onion', price: 1.50 },
            { category: 'Topping', name: 'Extra Bamboo Shoot', price: 1.50 },
            { category: 'Topping', name: 'Extra Nori', price: 1.50 },
            { category: 'Topping', name: 'Extra Kikurage', price: 1.50 },
            { category: 'Topping', name: 'Extra Cilantro', price: 1.50 },
        ];
        
        let cart = {};
        let currentCategory = 'all';
        let orders = [];
        
        // 初期化: ローカルストレージから注文履歴を読み込む
        function loadOrders() {
            try {
                orders = JSON.parse(localStorage.getItem('ramenOrders') || '[]');
            } catch (e) {
                orders = [];
            }
        }
        
        function renderMenu() {
            const menuItemsDiv = document.getElementById('menuItems');
            menuItemsDiv.innerHTML = '';
            
            const filtered = currentCategory === 'all' 
                ? menuData 
                : menuData.filter(item => item.category === currentCategory);
            
            filtered.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.onclick = () => addToCart(item);
                itemDiv.innerHTML = `
                    <div class="menu-item-name">${item.name}</div>
                    <div class="menu-item-price">$${item.price.toFixed(2)}</div>
                `;
                menuItemsDiv.appendChild(itemDiv);
            });
        }
        
        function addToCart(item) {
            const key = item.name;
            if (cart[key]) {
                cart[key].quantity++;
            } else {
                cart[key] = { ...item, quantity: 1 };
            }
            updateCart();
        }
        
        function removeFromCart(name) {
            delete cart[name];
            updateCart();
        }
        
        function changeQuantity(name, delta) {
            if (cart[name]) {
                cart[name].quantity += delta;
                if (cart[name].quantity <= 0) {
                    removeFromCart(name);
                } else {
                    updateCart();
                }
            }
        }
        
        function updateCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const items = Object.values(cart);
            
            if (items.length === 0) {
                cartItemsDiv.innerHTML = '<div class="empty-message">アイテムを追加してください</div>';
            } else {
                cartItemsDiv.innerHTML = items.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-left">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-qty">×${item.quantity}</div>
                        </div>
                        <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                        <div class="cart-item-actions">
                            <button class="qty-btn" onclick="changeQuantity('${item.name}', -1)">−</button>
                            <button class="qty-btn" onclick="changeQuantity('${item.name}', 1)">+</button>
                            <button class="delete-btn" onclick="removeFromCart('${item.name}')">✕</button>
                        </div>
                    </div>
                `).join('');
            }
            
            const subtotal = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.05;
            const total = subtotal + tax;
            
            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
            
            document.getElementById('paymentBtn').disabled = items.length === 0;
        }
        
        // イベントリスナー
        document.querySelectorAll('.category-tab').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderMenu();
            });
        });
        
        document.getElementById('paymentBtn').addEventListener('click', () => {
            document.getElementById('paymentModal').style.display = 'flex';
        });
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            cart = {};
            updateCart();
        });
        
        // 初期化
        loadOrders();
        renderMenu();
        updateSyncStatus('success');
    </script>

    <script>
        function toggleCardSection() {
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const cardTypeSection = document.getElementById('cardTypeSection');
            
            if (paymentMethod === 'credit') {
                cardTypeSection.classList.add('active');
            } else {
                cardTypeSection.classList.remove('active');
            }
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        async function confirmPayment() {
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const cardType = document.getElementById('cardType').value;
            
            if (paymentMethod === 'credit' && !cardType) {
                alert('カード種類を選択してください');
                return;
            }
            
            const items = Object.values(cart);
            const subtotal = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.05;
            const total = subtotal + tax;
            
            const orderData = {
                timestamp: new Date().toLocaleString('ja-JP'),
                paymentMethod: paymentMethod === 'cash' ? '現金' : 'クレジットカード',
                cardType: cardType || '-',
                items: items.map(item => `${item.name}×${item.quantity}`).join(' | '),
                subtotal: subtotal.toFixed(2),
                tax: tax.toFixed(2),
                total: total.toFixed(2)
            };
            
            // ローカルストレージに保存
            orders.push({
                ...orderData,
                id: new Date().getTime()
            });
            localStorage.setItem('ramenOrders', JSON.stringify(orders));
            
            // Google Sheetに記録
            updateSyncStatus('syncing');
            await saveToGoogleSheet(orderData);
            
            const cardInfo = cardType ? ` (${cardType})` : '';
            alert(`決済完了！✅\n合計: $${total.toFixed(2)}\n決済方法: ${orderData.paymentMethod}${cardInfo}\n\n✨ Googleシートに記録されました！`);
            
            closePaymentModal();
            document.getElementById('clearBtn').click();
        }

        async function saveToGoogleSheet(orderData) {
            const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgkvkT4UfrFGpFsZmmiNTfgQgOyTwv_1QMg2IHx7Nx0_50WLEUtNFhpXIx57759_1ZCQ/exec';
            
            try {
                const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(orderData),
                    mode: 'no-cors'
                });
                
                console.log('✅ Google Sheetに記録しました:', orderData);
                updateSyncStatus('synced');
                setTimeout(() => updateSyncStatus('success'), 2000);
            } catch (error) {
                console.error('❌ Google Sheet記録エラー:', error);
                updateSyncStatus('error');
                setTimeout(() => updateSyncStatus('success'), 2000);
            }
        }

        function updateSyncStatus(status) {
            const btn = document.getElementById('statusBtn');
            
            if (status === 'syncing') {
                btn.textContent = '📡 同期中...';
                btn.classList.remove('synced', 'error');
            } else if (status === 'synced') {
                btn.textContent = '✅ 同期完了';
                btn.classList.add('synced');
                btn.classList.remove('error');
            } else if (status === 'error') {
                btn.textContent = '⚠️ エラー';
                btn.classList.add('error');
                btn.classList.remove('synced');
            } else {
                btn.textContent = '✅ 準備完了';
                btn.classList.add('synced');
                btn.classList.remove('error');
            }
        }

        function exportToCSV() {
            if (orders.length === 0) {
                alert('まだ注文がありません');
                return;
            }
            
            let csv = '日時,決済方法,カード種類,購入アイテム,小計,税金,合計\n';
            orders.forEach(order => {
                csv += `"${order.timestamp}","${order.paymentMethod}","${order.cardType}","${order.items}",${order.subtotal},${order.tax},${order.total}\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `ramen_orders_${new Date().getTime()}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
